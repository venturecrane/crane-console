name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Format, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: |
          npm ci --prefix workers/crane-context
          npm ci --prefix workers/crane-watch

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Shell test suites
        # Four suites — 103 assertions, 69 of them covering secret-leak
        # detection — existed in this repo and no workflow ran any of them.
        # They passed, but nothing knew that, and nothing would have noticed
        # them going red. Suites are DISCOVERED, not listed, so a new one is
        # picked up without anyone remembering to register it here.
        run: npm run test:shell

      - name: Node test suites
        # Same defect as the shell suites above, one file extension over: on
        # 2026-08-24 scripts/__tests__/*.test.mjs (regression-parse-files,
        # pr-verify-check) were referenced by no npm script, no workflow and no
        # hook, so they had never executed. run-shell-tests.sh globs *.test.sh
        # only. Discovered, not listed, and finding zero suites is a failure.
        run: npm run test:scripts

      - name: AC-tick matcher parity
        # scripts/ac-tick-matcher.mjs is the tested source; the matcher block in
        # tick-acs-on-merge-reusable.yml is a spliced copy, because that
        # reusable has no checkout and cannot import at runtime. This fails if
        # the two drift apart.
        run: npm run check:ac-tick-parity

      - name: Skill triplet drift check
        # Catches the case where a skill author edits .claude/commands/<x>.md
        # without regenerating the .agents/skills/ and .gemini/commands/ peers.
        # This is the file-format half of the EOS gate; the runtime probe lives
        # in .github/workflows/pr-eos-gate.yml.
        run: scripts/sync-commands.sh --check
