name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

# Plan v3.1 §H-3: explicit minimum permissions. The scanning jobs only need
# to read repository contents; they do not write commits, comments, or
# artifacts. Explicit permissions block supersedes the repo default and
# protects against accidental write-capable tokens leaking into the
# authenticated curl calls below.
#
# `issues: write` is NOT granted here. Only the `notify` job needs it, and it
# takes it via a job-level permissions block so the scanning jobs — the ones
# that execute third-party rule packs and download release tarballs — keep a
# read-only token.
permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM Security Audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      # Without fail-fast:false a single failing leg cancels its siblings, so
      # only ever one project's findings reach the log. Every project reports.
      fail-fast: false
      matrix:
        # MUST stay in sync with the npm `directory:` entries in
        # .github/dependabot.yml. A project Dependabot files alerts against
        # but this matrix skips is a vulnerability nobody is watching — the
        # state this repo was in until 2026-08-12, when the matrix covered
        # only the two workers while `/`, `/packages/crane-mcp`, `/site` and
        # `/templates/venture` all carried unfixed high-severity advisories.
        #
        # No exclusions: all six npm directories are auditable, including
        # /templates/venture (a scaffold template, but it ships a real
        # package-lock.json and resolves like any other project).
        project:
          - '.'
          - packages/crane-mcp
          - workers/crane-context
          - workers/crane-watch
          - site
          - templates/venture
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - name: Run npm audit
        env:
          PROJECT: ${{ matrix.project }}
        # `npm audit` resolves its tree from a lockfile and needs no install,
        # so there is no `npm ci` here — no root postinstall, no private
        # GitHub Packages auth, no per-project install divergence.
        #
        # It IS audited in an isolated copy, and that is load-bearing rather
        # than tidiness. `packages/crane-mcp` is a member of the root
        # `workspaces: ["packages/*"]`, so `npm audit` run in that directory
        # walks up and audits the ROOT tree instead of the project's own
        # lockfile. Measured on this repo at 6514018: in place it reports 502
        # dependencies (identical to `/`); against its own package-lock.json
        # it reports 270. A matrix leg pointed at that directory would have
        # been a second copy of the root leg wearing a different name, green
        # for as long as it existed while the four high-severity advisories in
        # packages/crane-mcp/package-lock.json went unobserved.
        #
        # Copying package.json + package-lock.json into a scratch directory
        # with no parent workspace removes the ambiguity. `workspaces` is
        # stripped because the lockfile already carries the fully resolved
        # tree and the member directories are not copied.
        run: |
          set -euo pipefail

          iso="$RUNNER_TEMP/audit-iso"
          rm -rf "$iso"
          mkdir -p "$iso"
          cp "$PROJECT/package-lock.json" "$iso/package-lock.json"
          node -e '
            const fs = require("fs")
            const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
            delete pkg.workspaces
            fs.writeFileSync(process.argv[2], JSON.stringify(pkg, null, 2))
          ' "$PROJECT/package.json" "$iso/package.json"

          # How many packages this project's OWN lockfile describes. Compared
          # below against what npm actually audited: if the two ever diverge,
          # the leg is measuring somebody else's tree and must fail loudly
          # rather than report a green that means nothing.
          expected=$(node -e '
            const lock = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
            console.log(Object.keys(lock.packages || {}).filter(Boolean).length)
          ' "$iso/package-lock.json")

          cd "$iso"
          npm audit --json > audit.json 2> audit-stderr.txt || true
          if [ ! -s audit.json ]; then
            echo "::error::npm audit produced no output for $PROJECT"
            cat audit-stderr.txt
            exit 1
          fi

          observed=$(node -e '
            const rep = JSON.parse(require("fs").readFileSync("audit.json", "utf8"))
            console.log(rep?.metadata?.dependencies?.total ?? -1)
          ')

          echo "## NPM Audit: $PROJECT" >> "$GITHUB_STEP_SUMMARY"
          echo "Lockfile describes $expected packages; npm audited $observed." >> "$GITHUB_STEP_SUMMARY"

          if [ "$observed" != "$expected" ]; then
            echo "::error::Audit scope mismatch for $PROJECT — lockfile describes $expected packages but npm audited $observed. This leg is not observing its own lockfile; fix the isolation before trusting any result from it."
            echo "**SCOPE MISMATCH — this leg audited the wrong tree.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Report high+critical ourselves rather than leaning on
          # `--audit-level=high` exit codes, so the count that gates the merge
          # is the same number printed in the summary.
          node -e '
            const rep = JSON.parse(require("fs").readFileSync("audit.json", "utf8"))
            const vulns = rep.vulnerabilities || {}
            const bad = Object.entries(vulns)
              .filter(([, v]) => v.severity === "high" || v.severity === "critical")
              .map(([name, v]) => `- ${v.severity}: ${name} (${v.range})`)
            if (bad.length === 0) {
              console.log("No high/critical vulnerabilities found.")
              process.exit(0)
            }
            console.log("### Vulnerabilities Found")
            console.log(bad.join("\n"))
            process.exit(1)
          ' | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Plan §C.5 fleet-lint #1: never hardcode the gitleaks version. The
      # previous template pinned to gitleaks_8.21.2 which broke the entire
      # fleet's security pipeline. We can't use gitleaks/gitleaks-action@v2
      # because it requires a paid license for org repos. Install pattern
      # below queries the GitHub releases API for the latest tag, so the
      # version stays current automatically. Config lives in .gitleaks.toml.
      #
      # Plan v3.1 §H-3: the api.github.com curl MUST pass GITHUB_TOKEN via
      # the Authorization header. Unauthenticated API calls share a 60/hour
      # rate limit per GitHub Actions runner IP, and on busy days (or in
      # orgs with many concurrent workflows) the rate limit is consumed
      # before our call arrives, causing a 403 and a flaky Secret Detection
      # failure. With authentication the rate limit is 5000/hr per token,
      # more than sufficient. Fleet-lint rule #11 enforces this pattern.
      - name: Install Gitleaks (latest release)
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=$(curl -fsSL \
            -H "Authorization: Bearer $GH_API_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep '"tag_name"' | head -1 | sed -E 's/.*"v?([^"]+)".*/\1/')
          echo "Installing gitleaks v${GITLEAKS_VERSION}"
          # The release tarball download does NOT need authentication (it's
          # a public release asset served by github.com, not api.github.com)
          # but we pass the header anyway for symmetry in case GitHub
          # applies stricter rate limits to release downloads in the future.
          curl -fsSL \
            -H "Authorization: Bearer $GH_API_TOKEN" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          chmod +x gitleaks

      - name: Run Gitleaks
        run: |
          echo "## Secret Detection" >> $GITHUB_STEP_SUMMARY
          if ./gitleaks detect --source . --verbose --no-git --config .gitleaks.toml 2>&1 | tee gitleaks-output.txt; then
            echo "No secrets detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Secrets Found" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat gitleaks-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  typescript:
    name: TypeScript Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [crane-context, crane-watch]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        # Triggers the root postinstall which builds @venturecrane/crane-test-harness
        # so workers that consume it via `file:` deps can resolve dist/ during their own install.
        run: npm ci

      - name: Install worker dependencies
        working-directory: workers/${{ matrix.worker }}
        run: npm ci

      - name: TypeScript check
        working-directory: workers/${{ matrix.worker }}
        run: npm run typecheck

  semgrep:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      # Pinned container tag. Dependabot watches returntocorp/semgrep in
      # .github/dependabot.yml so pin bumps land as PRs (auto-merged by
      # .github/workflows/dependabot-auto-merge.yml when safe).
      image: returntocorp/semgrep:1.157.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Diff-aware scanning (--baseline-commit) resolves a merge-base, so
          # it needs full history. The default shallow clone can't reach it.
          fetch-depth: 0
      - name: Determine baseline commit
        id: baseline
        # Diff-aware gating: only findings NEW since the baseline block a
        # merge. On PRs the baseline is the merge-base with the target
        # branch; on pushes it is the commit the branch pointed at before the
        # push. Scheduled and manual runs get NO baseline and remain a full
        # audit (unchanged) — the daily cron still surfaces pre-existing debt.
        # Motivation: the p/* rule packs are fetched live from the registry,
        # so a pack update can reclassify long-standing code as blocking and
        # freeze all merges on unrelated PRs. Baselining scopes the merge gate
        # to what each change actually introduces.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The container runs git as root over a workspace owned by the
          # runner UID; without this, git refuses with "dubious ownership".
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          baseline=""
          case "$EVENT_NAME" in
            pull_request)
              baseline=$(git merge-base HEAD "$PR_BASE_SHA" 2>/dev/null || true)
              ;;
            push)
              # Skip the all-zero SHA GitHub sends for a branch's first push.
              case "$PUSH_BEFORE" in
                '' | 0000000000000000000000000000000000000000) ;;
                *) baseline=$(git merge-base HEAD "$PUSH_BEFORE" 2>/dev/null || true) ;;
              esac
              ;;
          esac
          echo "commit=$baseline" >> "$GITHUB_OUTPUT"
          if [ -n "$baseline" ]; then
            echo "Diff-aware baseline: $baseline (only findings new since this commit block)."
          else
            echo "No baseline — full audit (schedule/dispatch or first push)."
          fi
      - name: Run Semgrep
        # POSIX-compatible shell script — the returntocorp/semgrep container
        # uses Alpine ash, not bash, so ${PIPESTATUS[n]} is unavailable.
        # We redirect to a file, capture $? directly, then cat for both the
        # CI log and (on failure) $GITHUB_STEP_SUMMARY.
        env:
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
        run: |
          echo "## Static Analysis (Semgrep)" >> "$GITHUB_STEP_SUMMARY"
          # `--error` fails on findings. `--strict` was tried but exits 3 on
          # the ~0.4% of files in this repo that Semgrep can't fully parse
          # (yaml/ts variants) — unrelated to security findings. Pack-load
          # failures still surface loudly in the log without --strict.
          # `--baseline-commit` (when set) reports only findings introduced
          # since the baseline, so pre-existing debt doesn't block merges.
          run_semgrep() {
            semgrep scan "$@" \
              --metrics=off \
              --config=p/typescript \
              --config=p/javascript \
              --config=p/security-audit \
              --config=p/owasp-top-ten \
              --exclude=node_modules --exclude=dist --exclude='**/*.test.ts' \
              --exclude=packages/crane-test-harness/dist \
              > semgrep-output.txt 2>&1
          }
          set +e
          if [ -n "$BASELINE_COMMIT" ]; then
            run_semgrep --error --baseline-commit "$BASELINE_COMMIT"
          else
            run_semgrep --error
          fi
          rc=$?
          set -e
          cat semgrep-output.txt
          if [ "$rc" -ne 0 ]; then
            {
              echo '### Findings'
              echo '```'
              cat semgrep-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

  nosemgrep-audit:
    name: nosemgrep Justification Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Require substantive justification on every nosemgrep
        # Every `// nosemgrep` annotation must be followed by ` — ` or `: ` and
        # at least 20 characters of justification prose. Without this audit,
        # the gate degrades over time as agents silently silence findings by
        # appending a bare `// nosemgrep` comment.
        run: |
          set -e
          bad=$(grep -rnP --include='*.ts' --include='*.js' \
            '//[[:space:]]*nosemgrep(:[^[:space:]]+)?[[:space:]]*(?:[—:][[:space:]]*.{0,19})?[[:space:]]*$' \
            . \
            --exclude-dir=node_modules --exclude-dir=dist || true)
          if [ -n "$bad" ]; then
            echo "nosemgrep annotations require ≥20 chars of justification after ' — ' or ': ':"
            echo "$bad"
            exit 1
          fi
          block=$(grep -rnzP --include='*.ts' --include='*.js' \
            '/\*[^*]*nosemgrep[^*]*\*/' \
            . \
            --exclude-dir=node_modules --exclude-dir=dist || true)
          if [ -n "$block" ]; then
            echo "Block-comment nosemgrep not supported; use inline // nosemgrep:"
            echo "$block"
            exit 1
          fi
          disabled=$(grep -rn --include='*.ts' --include='*.js' 'semgrep-disable' . --exclude-dir=node_modules --exclude-dir=dist || true)
          if [ -n "$disabled" ]; then
            echo "'semgrep-disable' is banned; use rule-specific nosemgrep:"
            echo "$disabled"
            exit 1
          fi

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, gitleaks, typescript, semgrep, nosemgrep-audit]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Security Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.npm-audit.result }}" == "success" ]; then
            echo "- NPM Audit: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- NPM Audit: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.gitleaks.result }}" == "success" ]; then
            echo "- Secret Detection: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Secret Detection: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.typescript.result }}" == "success" ]; then
            echo "- TypeScript: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- TypeScript: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.semgrep.result }}" == "success" ]; then
            echo "- Static Analysis (Semgrep): PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Static Analysis (Semgrep): FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.nosemgrep-audit.result }}" == "success" ]; then
            echo "- nosemgrep Justification Audit: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- nosemgrep Justification Audit: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          # Fail if any check failed
          if [ "${{ needs.npm-audit.result }}" != "success" ] || \
             [ "${{ needs.gitleaks.result }}" != "success" ] || \
             [ "${{ needs.typescript.result }}" != "success" ] || \
             [ "${{ needs.semgrep.result }}" != "success" ] || \
             [ "${{ needs.nosemgrep-audit.result }}" != "success" ]; then
            echo ""
            echo "One or more security checks failed."
            exit 1
          fi

  notify:
    name: Alert on scheduled failure
    runs-on: ubuntu-latest
    needs: [npm-audit, gitleaks, typescript, semgrep, nosemgrep-audit]
    # Scheduled and manual runs only. A PR that fails its own security check
    # already tells the author through the check status on the PR; alerting
    # there is noise. Nobody is watching a 6am cron, which is how Security
    # Checks stayed red on main for nine consecutive days (2026-08-04 →
    # 2026-08-12) and thirteen days in July with no record anywhere except a
    # $GITHUB_STEP_SUMMARY page that nobody opens.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      # The only extra grant in this workflow, scoped to this job. Needed to
      # open, comment on, and close the alert issue below.
      issues: write
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_NPM: ${{ needs.npm-audit.result }}
          R_GITLEAKS: ${{ needs.gitleaks.result }}
          R_TYPESCRIPT: ${{ needs.typescript.result }}
          R_SEMGREP: ${{ needs.semgrep.result }}
          R_NOSEMGREP: ${{ needs.nosemgrep-audit.result }}
        # Sink choice: a single deduplicated GitHub issue, NOT the D1
        # fleet_health_findings table that fleet-ops-health.yml ingests into.
        # D1 was the more consistent-looking option and was rejected on
        # mechanics: the ingest endpoint accepts only source='github' or
        # 'machine' (workers/crane-context/src/endpoints/fleet-health.ts:69),
        # and every ingest is a FULL-SNAPSHOT refresh that auto-resolves any
        # open finding of the same source not present in the payload
        # (src/fleet-health.ts:279-289). Posting from here as 'github' would
        # silently resolve every open fleet-ops-health finding for this repo —
        # the exact bug that file's own comment flags as critical. Adding a
        # third source means changing and redeploying the worker, which is out
        # of this change's lane and could not be exercised before merge.
        #
        # Dedup is by exact issue title: nine days of red produce one issue
        # with nine comments, not nine issues. When everything passes again,
        # the open alert issue is closed — green restores truth, the same
        # semantics fleet-ops-health gets from its snapshot auto-resolve.
        run: |
          set -euo pipefail

          TITLE="Security Checks failing on main"

          failed=""
          [ "$R_NPM" = "success" ]        || failed="$failed
          - NPM Security Audit: \`$R_NPM\`"
          [ "$R_GITLEAKS" = "success" ]   || failed="$failed
          - Secret Detection: \`$R_GITLEAKS\`"
          [ "$R_TYPESCRIPT" = "success" ] || failed="$failed
          - TypeScript Validation: \`$R_TYPESCRIPT\`"
          [ "$R_SEMGREP" = "success" ]    || failed="$failed
          - Static Analysis (Semgrep): \`$R_SEMGREP\`"
          [ "$R_NOSEMGREP" = "success" ]  || failed="$failed
          - nosemgrep Justification Audit: \`$R_NOSEMGREP\`"

          existing=$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

          if [ -z "$failed" ]; then
            echo "All security checks passed."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "Security Checks passed on $(date -u +%Y-%m-%dT%H:%M:%SZ). Closing. Run: $RUN_URL"
              gh issue close "$existing" --repo "$REPO"
              echo "Closed alert issue #$existing."
            else
              echo "No open alert issue to close."
            fi
            exit 0
          fi

          body="Scheduled **Security Checks** run failed.

          Failing jobs:$failed

          Run: $RUN_URL

          This issue is deduplicated by title — repeat failures add a comment here
          rather than opening a new issue, and it closes automatically once a
          scheduled run goes green."

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "Commented on existing alert issue #$existing."
          else
            url=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$body")
            echo "Opened alert issue: $url"
          fi
