name: D1 Export Probe (temporary)

# TEMPORARY. Deleted before this branch's PR merges.
#
# Answers one question the Cloudflare docs leave ambiguous: the documented
# limitation is that export is unsupported "for databases containing virtual
# tables". It does not say whether a --table-scoped export of an ORDINARY
# table is also refused when a virtual table exists elsewhere in the database.
# The error string is not in wrangler's client bundle, so the precheck is
# server-side and cannot be settled by reading code.
#
# Probes staging, not prod: an export blocks other requests on the database
# it runs against, and the two share a schema.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
        working-directory: workers/crane-context

      - name: Probe
        working-directory: workers/crane-context
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          echo "===== 1. SCHEMA: what is actually in this database ====="
          npx wrangler d1 execute DB --remote --json --command \
            "SELECT name, CASE WHEN sql LIKE 'CREATE VIRTUAL TABLE%' THEN 'VIRTUAL' ELSE 'ordinary' END AS kind FROM sqlite_master WHERE type='table' ORDER BY name" \
            || echo "SCHEMA QUERY FAILED"

          echo ""
          echo "===== 2. CONTROL: full export MUST fail ====="
          # If this succeeds, the diagnosis is wrong and everything below is
          # moot. A probe without a known-failing control proves nothing.
          if npx wrangler d1 export DB --remote --output=/tmp/full.sql 2>&1; then
            echo "CONTROL-UNEXPECTED: full export SUCCEEDED — diagnosis is wrong, stop and rethink"
          else
            echo "CONTROL-OK: full export refused, as expected"
          fi

          echo ""
          echo "===== 3. THE QUESTION: --table export of an ordinary table ====="
          if npx wrangler d1 export DB --remote --table=notes --output=/tmp/notes.sql 2>&1; then
            echo "ANSWER-YES: --table export works despite the virtual table"
            echo "bytes: $(wc -c < /tmp/notes.sql)"
            echo "first 5 lines:"
            head -5 /tmp/notes.sql
          else
            echo "ANSWER-NO: --table export is refused too — per-table workaround is dead"
          fi
